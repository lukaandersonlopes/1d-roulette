<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1D Roulette - Turnê Mundial</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fce4ec; /* Um tom suave de rosa/vermelho */
            color: #333; 
            text-align: center; 
            padding: 20px; 
        }
        h1 { color: #d81b60; font-size: 2.5em; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { 
            background: white; 
            border-radius: 15px; 
            padding: 30px; 
            margin: 20px auto; 
            max-width: 350px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            display: none; 
            border-top: 5px solid #d81b60;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        button { 
            background-color: #d81b60; 
            color: white; 
            border: none; 
            padding: 15px 40px; 
            font-size: 20px; 
            font-weight: bold;
            border-radius: 30px; 
            cursor: pointer; 
            box-shadow: 0 4px 6px rgba(216, 27, 96, 0.3);
            transition: all 0.2s; 
        }
        button:hover { background-color: #ad1457; transform: scale(1.05); }
        button:active { transform: scale(0.95); }
        .member-name { font-size: 28px; font-weight: bold; color: #111; margin-bottom: 5px; }
        .era { font-style: italic; color: #d81b60; font-weight: bold; font-size: 16px; margin-bottom: 15px; }
        .stats { margin-top: 15px; font-size: 15px; text-align: left; background: #fdf0f4; padding: 15px; border-radius: 8px; }
        .stats p { margin: 5px 0; border-bottom: 1px solid #f8bbd0; padding-bottom: 5px; }
        .stats p:last-child { border-bottom: none; }
        .passiva { margin-top: 15px; font-size: 13px; color: #555; font-style: italic; text-align: center;}
    </style>
</head>
<body>
    <h1>🎤 1D Roulette</h1>
    <p class="subtitle">Prepare-se para a Turnê Mundial. Gire a roleta e monte sua equipe!</p>

    <button onclick="girarRoleta()">Girar Roleta!</button>

    <div class="card" id="resultCard">
        <div class="member-name" id="nameDisplay">Membro</div>
        <div class="era" id="eraDisplay">Era</div>
        <div class="stats" id="statsDisplay"></div>
        <div class="passiva" id="passivaDisplay"></div>
    </div>

    <script>
        // Nosso "Banco de Dados" do One Direction
        const membros = [
            { nome: "Harry Styles", era: "Four", folego: 90, vocal: 95, carisma: 100, passiva: "🌟 Carta Lendária: Se a turnê falhar, o carisma absurdo do Harry ganha uma segunda chance com o público." },
            { nome: "Zayn Malik", era: "Take Me Home", folego: 85, vocal: 100, carisma: 90, passiva: "🎤 High Note: Vence automaticamente qualquer desafio vocal em shows de estádio." },
            { nome: "Niall Horan", era: "Midnight Memories", folego: 95, vocal: 80, carisma: 95, passiva: "🎸 Acústico: Aumenta a barra de energia de toda a banda ao tocar violão nos bastidores." },
            { nome: "Louis Tomlinson", era: "Up All Night", folego: 80, vocal: 85, carisma: 95, passiva: "🧭 Liderança: Impede que a banda perca foco durante escândalos de paparazzi." },
            { nome: "Liam Payne", era: "Made in the A.M.", folego: 100, vocal: 90, carisma: 85, passiva: "⚓ Sustentação: O pilar do grupo. Não perde fôlego mesmo fazendo três shows seguidos." }
        ];

        function girarRoleta() {
            const card = document.getElementById('resultCard');
            const button = document.querySelector('button');
            
            card.style.display = 'none'; // Esconde a carta
            button.innerText = "Sorteando...";
            button.disabled = true;

            // Efeito de suspense
            setTimeout(() => {
                const random = Math.floor(Math.random() * membros.length);
                const sorteado = membros[random];

                document.getElementById('nameDisplay').innerText = sorteado.nome;
                document.getElementById('eraDisplay').innerText = "Era: " + sorteado.era;
                document.getElementById('statsDisplay').innerHTML = `
                    <p><strong>Fôlego:</strong> ${sorteado.folego}/100</p>
                    <p><strong>Vocal:</strong> ${sorteado.vocal}/100</p>
                    <p><strong>Carisma:</strong> ${sorteado.carisma}/100</p>
                `;
                document.getElementById('passivaDisplay').innerText = sorteado.passiva;
                
                card.style.display = 'block';
                button.innerText = "Girar Novamente!";
                button.disabled = false;
            }, 600);
        }
    </script>
</body>
</html>
