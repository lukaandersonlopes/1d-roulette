<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1D Roulette - Draft da Turnê</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fce4ec; 
            color: #333; 
            text-align: center; 
            padding: 20px; 
        }
        h1 { color: #d81b60; font-size: 2.5em; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 20px; }
        
        .controls { margin-bottom: 20px; }
        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid #d81b60;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        select { background: white; color: #d81b60; outline: none; }
        button { background-color: #d81b60; color: white; transition: 0.2s; }
        button:hover:not(:disabled) { background-color: #ad1457; transform: scale(1.05); }
        button:disabled { background-color: #f8bbd0; border-color: #f8bbd0; cursor: not-allowed; transform: none; }

        /* Estilo da Equipe Formada (Os 5 Slots) */
        .team-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .slot {
            width: 120px;
            height: 150px;
            background: #fff;
            border: 2px dashed #d81b60;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            padding: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .slot.filled { border-style: solid; background: #fdf0f4; }
        .slot-name { font-weight: bold; color: #d81b60; margin-bottom: 5px; text-align: center; }
        .slot-stats { font-size: 11px; text-align: left; width: 100%; }

        /* A Carta do Sorteio Atual */
        .card { 
            background: white; 
            border-radius: 15px; 
            padding: 20px; 
            margin: 20px auto; 
            max-width: 300px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            display: none; 
            border-top: 5px solid #d81b60;
        }
        
        .member-name { font-size: 24px; font-weight: bold; color: #111; margin-bottom: 5px; }
        .era { font-style: italic; color: #d81b60; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
        .stats { margin-top: 15px; font-size: 14px; text-align: left; background: #fdf0f4; padding: 10px; border-radius: 8px; }
        .passiva { margin-top: 15px; font-size: 12px; color: #555; font-style: italic; text-align: center;}
    </style>
</head>
<body>
    <h1>🎤 1D Roulette: O Draft</h1>
    <p class="subtitle" id="statusDraft">Gire a roleta para formar sua equipe (0/5 recrutados)</p>

    <div class="team-container" id="teamSlots">
        <div class="slot" id="slot-0">Vazio</div>
        <div class="slot" id="slot-1">Vazio</div>
        <div class="slot" id="slot-2">Vazio</div>
        <div class="slot" id="slot-3">Vazio</div>
        <div class="slot" id="slot-4">Vazio</div>
    </div>

    <div class="controls">
        <select id="eraFilter">
            <option value="Todas">Todas as Eras</option>
            <option value="Up All Night">Up All Night</option>
            <option value="Take Me Home">Take Me Home</option>
            <option value="Midnight Memories">Midnight Memories</option>
            <option value="Four">Four</option>
            <option value="Made in the A.M.">Made in the A.M.</option>
        </select>
        <button id="btnGirar" onclick="girarRoleta()">Recrutar Membro</button>
        <button id="btnTurne" style="display: none; background-color: #2e7d32; border-color: #2e7d32;" onclick="alert('Sistema de shows em construção!')">Iniciar Turnê!</button>
    </div>

    <div class="card" id="resultCard">
        <div class="member-name" id="nameDisplay">Membro</div>
        <div class="era" id="eraDisplay">Era</div>
        <div class="stats" id="statsDisplay"></div>
        <div class="passiva" id="passivaDisplay"></div>
    </div>

    <script>
        // Removi as fotos por enquanto para focar na mecânica.
        const membros = [
            { nome: "Harry Styles", era: "Four", folego: 90, vocal: 95, carisma: 100, passiva: "Lendário: Carisma absurdo." },
            { nome: "Zayn Malik", era: "Take Me Home", folego: 85, vocal: 100, carisma: 90, passiva: "High Note: Vence desafios vocais." },
            { nome: "Niall Horan", era: "Midnight Memories", folego: 95, vocal: 80, carisma: 95, passiva: "Acústico: Recupera energia." },
            { nome: "Louis Tomlinson", era: "Up All Night", folego: 80, vocal: 85, carisma: 95, passiva: "Liderança: Mantém o foco." },
            { nome: "Liam Payne", era: "Made in the A.M.", folego: 100, vocal: 90, carisma: 85, passiva: "Sustentação: Não perde fôlego." },
            { nome: "Harry Styles", era: "Up All Night", folego: 80, vocal: 85, carisma: 90, passiva: "Charme extra." }
        ];

        let equipe = [];
        const MAX_EQUIPE = 5;

        function girarRoleta() {
            if (equipe.length >= MAX_EQUIPE) return;

            const filtro = document.getElementById('eraFilter').value;
            let membrosFiltrados = membros;

            if (filtro !== "Todas") {
                membrosFiltrados = membros.filter(m => m.era === filtro);
            }

            if (membrosFiltrados.length === 0) {
                alert("Sem cartas para a era " + filtro + " ainda!");
                return;
            }

            // Sorteia instantaneamente (sem tremedeira)
            const random = Math.floor(Math.random() * membrosFiltrados.length);
            const sorteado = membrosFiltrados[random];

            // Adiciona na equipe e atualiza a interface
            equipe.push(sorteado);
            atualizarSlot(equipe.length - 1, sorteado);
            mostrarCarta(sorteado);

            // Atualiza status do Draft
            document.getElementById('statusDraft').innerText = `Gire a roleta para formar sua equipe (${equipe.length}/${MAX_EQUIPE} recrutados)`;

            // Verifica se a equipe lotou
            if (equipe.length === MAX_EQUIPE) {
                document.getElementById('btnGirar').style.display = 'none';
                document.getElementById('eraFilter').style.display = 'none';
                document.getElementById('btnTurne').style.display = 'inline-block';
            }
        }

        function atualizarSlot(index, membro) {
            const slot = document.getElementById(`slot-${index}`);
            slot.classList.add('filled');
            slot.innerHTML = `
                <div class="slot-name">${membro.nome}</div>
                <div style="font-size: 10px; color: #888;">${membro.era}</div>
                <div class="slot-stats">
                    F: ${membro.folego} | V: ${membro.vocal} | C: ${membro.carisma}
                </div>
            `;
        }

        function mostrarCarta(membro) {
            const card = document.getElementById('resultCard');
            document.getElementById('nameDisplay').innerText = membro.nome;
            document.getElementById('eraDisplay').innerText = "Era: " + membro.era;
            document.getElementById('statsDisplay').innerHTML = `
                <p><strong>Fôlego:</strong> ${membro.folego}</p>
                <p><strong>Vocal:</strong> ${membro.vocal}</p>
                <p><strong>Carisma:</strong> ${membro.carisma}</p>
            `;
            document.getElementById('passivaDisplay').innerText = membro.passiva;
            card.style.display = 'block';
        }
    </script>
</body>
</html>
