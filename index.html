<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1D Roulette: A Turnê do Destino</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #fff; text-align: center; padding: 20px; }
        h1 { color: #ff4081; font-size: 2.5em; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px;}
        .subtitle { color: #aaa; margin-bottom: 20px; font-size: 14px;}
        
        /* Barra de Status */
        .status-board { display: flex; justify-content: center; gap: 30px; background: #333; padding: 15px; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 20px; font-weight: bold;}
        .status-shows { color: #00e5ff; }
        .status-hype { color: #69f0ae; }

        /* A Roleta Principal */
        .roulette-container { background: #222; border: 4px solid #ff4081; border-radius: 20px; padding: 30px; max-width: 400px; margin: 0 auto 30px auto; box-shadow: 0 0 20px rgba(255, 64, 129, 0.4); }
        .roulette-screen { background: #111; border-radius: 10px; padding: 40px 20px; font-size: 28px; font-weight: bold; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; border: 2px inset #555; }
        
        .result-title { font-size: 32px; margin-bottom: 10px; }
        .result-desc { font-size: 16px; color: #ccc; font-weight: normal; }

        button { background-color: #ff4081; color: white; border: none; padding: 15px 30px; font-size: 22px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 0 #c51162; text-transform: uppercase;}
        button:hover:not(:disabled) { background-color: #f50057; transform: translateY(2px); box-shadow: 0 3px 0 #c51162; }
        button:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 0 0 #c51162; }
        button:disabled { background-color: #555; box-shadow: 0 5px 0 #333; cursor: not-allowed; color: #888;}

        /* Equipe Recrutada */
        h2 { color: #00e5ff; margin-top: 40px; }
        .team-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 30px; }
        .slot { width: 110px; height: 140px; background: #333; border: 2px solid #555; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; text-align: center; transition: 0.3s;}
        .slot.member { border-color: #ff4081; background: #2a0a18; }
        .slot-icon { font-size: 40px; margin-bottom: 10px; }
        .slot-name { font-weight: bold; font-size: 14px; color: #fff; }
        .slot-role { font-size: 11px; color: #aaa; margin-top: 5px; }

        /* Animação do Sorteio */
        .spinning { animation: pulse 0.1s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.02); opacity: 1; } }

        /* Cores dos Resultados */
        .color-show { color: #00e5ff; }
        .color-bad { color: #ff5252; }
        .color-item { color: #ffd740; }
        .color-recruit { color: #b388ff; }
    </style>
</head>
<body>

    <h1>🎰 1D Roulette</h1>
    <p class="subtitle">Gire a Roleta do Destino. Sobreviva a 10 shows sem o Hype chegar a zero!</p>

    <div class="status-board">
        <div class="status-shows" id="showCounter">Shows: 0/10 🎤</div>
        <div class="status-hype" id="hypeCounter">Hype: 100% 💚</div>
    </div>

    <div class="roulette-container">
        <div class="roulette-screen" id="rouletteScreen">
            <div class="result-title" id="screenTitle">Gire a Roleta!</div>
            <div class="result-desc" id="screenDesc">O que a turnê reserva para hoje?</div>
        </div>
        <button id="btnGirar" onclick="iniciarGiro()">Girar o Destino!</button>
    </div>

    <h2>Sua Equipe (Comitiva)</h2>
    <div class="team-container" id="teamContainer">
        </div>

    <script>
        let hype = 100;
        let shows = 0;
        let equipe = [];

        // O Sistema de Pesos! Quanto menor o número, mais raro.
        const categorias = [
            { tipo: 'show', peso: 45 },
            { tipo: 'problema', peso: 25 },
            { tipo: 'item', peso: 15 },
            { tipo: 'recrutamento', peso: 15 }
        ];

        // Personagens e suas raridades (pesos)
        const personagens = [
            { id: 1, nome: "Harry Styles", papel: "Vocalista", icone: "✨", peso: 5 }, // Muito Raro
            { id: 2, nome: "Zayn Malik", papel: "High Note", icone: "🚬", peso: 10 },  // Raro
            { id: 3, nome: "Niall Horan", papel: "Guitarra", icone: "🎸", peso: 15 },
            { id: 4, nome: "Liam Payne", papel: "Pilar", icone: "⚓", peso: 15 },
            { id: 5, nome: "Louis Tomlinson", papel: "Líder", icone: "🧭", peso: 15 },
            { id: 6, nome: "Paul Higgins", papel: "Segurança", icone: "🛡️", peso: 40 }, // Comum
            { id: 7, nome: "Lou Teasdale", papel: "Estilista", icone: "✂️", peso: 40 }, // Comum
            { id: 8, nome: "Simon Cowell", papel: "Chefe Chato", icone: "🕴️", peso: 5 } // Carta troll!
        ];

        const imprevistos = [
            "Paparazzi invadiu o hotel! (-15% Hype)",
            "Alguém caiu no palco! (-20% Hype)",
            "A van quebrou no caminho! (-10% Hype)",
            "Rumores falsos no Twitter! (-15% Hype)",
            "Zayn não quer acordar! (-20% Hype)"
        ];

        const itens = [
            "Achou a Cenoura do Louis! (+15% Hype)",
            "Bebeu o Chá de Camomila! (+20% Hype)",
            "Fãs cantaram junto! (+25% Hype)",
            "Um dia de folga na piscina! (+30% Hype)"
        ];

        // Função mágica que escolhe coisas baseadas no PESO (probabilidade)
        function sortearComPeso(lista) {
            const pesoTotal = lista.reduce((soma, item) => soma + item.peso, 0);
            let random = Math.random() * pesoTotal;
            for (let i = 0; i < lista.length; i++) {
                if (random < lista[i].peso) return lista[i];
                random -= lista[i].peso;
            }
        }

        function atualizarStatus() {
            document.getElementById('showCounter').innerText = `Shows: ${shows}/10 🎤`;
            document.getElementById('hypeCounter').innerText = `Hype: ${hype}% 💚`;
        }

        function iniciarGiro() {
            const btn = document.getElementById('btnGirar');
            const screen = document.getElementById('rouletteScreen');
            const title = document.getElementById('screenTitle');
            const desc = document.getElementById('screenDesc');

            btn.disabled = true;
            screen.classList.add('spinning');
            
            // Efeito visual de caça-níquel rodando
            let tempo = 0;
            const intervalo = setInterval(() => {
                const cores = ['color-show', 'color-bad', 'color-item', 'color-recruit'];
                const textos = ["🎶 SHOW?", "💥 TRETA?", "🎁 ITEM?", "👤 ALGUÉM?"];
                const rnd = Math.floor(Math.random() * 4);
                
                title.className = `result-title ${cores[rnd]}`;
                title.innerText = textos[rnd];
                desc.innerText = "...";
                
                tempo += 100;
                if (tempo >= 2000) { // Gira por 2 segundos
                    clearInterval(intervalo);
                    screen.classList.remove('spinning');
                    aplicarResultado();
                }
            }, 100);
        }

        function aplicarResultado() {
            const btn = document.getElementById('btnGirar');
            const title = document.getElementById('screenTitle');
            const desc = document.getElementById('screenDesc');
            
            const categoriaSorteada = sortearComPeso(categorias);

            if (categoriaSorteada.tipo === 'show') {
                shows++;
                title.className = 'result-title color-show';
                title.innerText = "🎶 SHOW ÉPICO!";
                desc.innerText = "Estádio lotado! A turnê avançou.";
            } 
            else if (categoriaSorteada.tipo === 'problema') {
                const problema = imprevistos[Math.floor(Math.random() * imprevistos.length)];
                // Extrai o número do dano da string (ex: -15)
                const dano = parseInt(problema.match(/\d+/)[0]);
                hype -= dano;
                
                title.className = 'result-title color-bad';
                title.innerText = "💥 TRETA!";
                desc.innerText = problema;
            }
            else if (categoriaSorteada.tipo === 'item') {
                const item = itens[Math.floor(Math.random() * itens.length)];
                const cura = parseInt(item.match(/\d+/)[0]);
                hype += cura;
                if(hype > 100) hype = 100; // Limita em 100%

                title.className = 'result-title color-item';
                title.innerText = "🎁 SORTE!";
                desc.innerText = item;
            }
            else if (categoriaSorteada.tipo === 'recrutamento') {
                // Filtra para não recrutar quem já tá na equipe
                const personagensDisponiveis = personagens.filter(p => !equipe.includes(p.id));
                
                if (personagensDisponiveis.length === 0) {
                    title.className = 'result-title color-show';
                    title.innerText = "🚐 VAN LOTADA";
                    desc.innerText = "Você já recrutou todo mundo! Ganhou um show grátis.";
                    shows++;
                } else {
                    const novoMembro = sortearComPeso(personagensDisponiveis);
                    equipe.push(novoMembro.id);
                    adicionarNaEquipe(novoMembro);
                    
                    title.className = 'result-title color-recruit';
                    title.innerText = "👤 RECRUTADO!";
                    desc.innerText = `Você puxou ${novoMembro.nome} para a van da turnê!`;

                    // Punição se pegar o Simon Cowell
                    if(novoMembro.nome === "Simon Cowell") {
                        desc.innerText = "Vish, o Simon Cowell apareceu para cobrar resultados! (-10% Hype)";
                        hype -= 10;
                    }
                }
            }

            atualizarStatus();
            verificarFimDeJogo(btn);
        }

        function adicionarNaEquipe(membro) {
            const container = document.getElementById('teamContainer');
            container.innerHTML += `
                <div class="slot member">
                    <div class="slot-icon">${membro.icone}</div>
                    <div class="slot-name">${membro.nome}</div>
                    <div class="slot-role">${membro.papel}</div>
                </div>
            `;
        }

        function verificarFimDeJogo(btn) {
            if (hype <= 0) {
                document.getElementById('hypeCounter').innerText = `Hype: 0% 💔`;
                setTimeout(() => {
                    alert("💔 GAME OVER! A turnê faliu, os fãs foram embora e o Hype acabou.");
                    location.reload();
                }, 500);
            } else if (shows >= 10) {
                setTimeout(() => {
                    alert("🏆 VOCÊ VENCEU! A Turnê Mundial de 10 shows foi um sucesso histórico!");
                    location.reload();
                }, 500);
            } else {
                btn.disabled = false; // Libera o botão pro próximo giro se não acabou
            }
        }
    </script>
</body>
</html>
